[project]
name = "appbuilderhck-backend"
version = "0.1.0"
description = "Local, explicitly confirmed household visual memory API"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi==0.143.0", "pydantic==2.14.0", "uvicorn==0.54.0",
  "pillow==12.3.0", "httpx==0.28.1",
  "opencv-python-headless==4.13.0.92", "numpy==2.2.6",
]

[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app", "app.*"]
namespaces = false

[tool.setuptools.package-data]
app = ["migrations/*.sql", "static/*"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "ruff==0.16.10", "mypy==2.4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true

